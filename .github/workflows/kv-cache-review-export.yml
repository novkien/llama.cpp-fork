name: Cache review source export

on:
  push:
    branches: [design/issue-1-kv-cache-retention]
    paths: [.github/workflows/kv-cache-review-export.yml]

permissions:
  contents: read

jobs:
  source:
    if: github.repository == 'novkien/llama.cpp-fork'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect Python 3.13 wheels
        run: |
          mkdir -p "${RUNNER_TEMP}/cache-review/wheels"
          python -m pip download --dest "${RUNNER_TEMP}/cache-review/wheels" \
            --only-binary=:all: --python-version 313 --platform manylinux2014_x86_64 --implementation cp --abi cp313 'jiter>=0.10,<1'
      - uses: actions/upload-artifact@v4
        with:
          name: cache-review-python313
          path: ${{ runner.temp }}/cache-review/
          retention-days: 1
          if-no-files-found: error
