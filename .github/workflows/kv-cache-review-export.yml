name: Cache review validation and publication

on:
  push:
    branches: [design/issue-1-kv-cache-retention]
    paths: [.github/workflows/kv-cache-review-export.yml]

permissions:
  contents: write

jobs:
  validate:
    if: github.repository == 'novkien/llama.cpp-fork'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_BRANCH: design/issue-1-kv-cache-retention
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Install the exact reviewed payload
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/cache-review"
          test "$(git ls-remote origin "refs/heads/${REVIEW_BRANCH}" | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          chunks = [
              'e61ee5e62d9cb087e83c9785b4fdb021f3481cb1',
              '0768ea48e0ea3ca49df96f221aaf77ab7f3a40b5',
              '6ae71d11bbb7c533b1bfdfc4e4fcc52e81f72f38',
              '0a42bc60c4859517681ab43d19a7e4fe633e6b3b',
          ]
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          encoded = []
          for sha in chunks:
              result = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}']))
              data = base64.b64decode(result['content'])
              assert blob_sha(data) == sha, 'transport checksum mismatch'
              encoded.append(data)
          payload = json.loads(lzma.decompress(b''.join(encoded)))
          manifest = payload['manifest']
          expected_paths = {
              'common/common.cpp', 'common/common.h',
              'docs/kv-cache-retention/DESIGN.md', 'docs/kv-cache-retention/IMPLEMENTATION.md',
              'docs/kv-cache-retention/README.md', 'docs/kv-cache-retention/TESTING.md',
              'tests/CMakeLists.txt', 'tests/test-server-prompt-cache.cpp',
              'tools/server/server-context.cpp', 'tools/server/server-task.cpp',
              'tools/server/server-task.h', 'tools/server/tests/unit/test_completion.py',
              'tools/server/tests/utils.py',
          }
          assert {r['path'] for r in manifest} == expected_paths
          for record in manifest:
              path = pathlib.Path(record['path'])
              actual = blob_sha(path.read_bytes()) if path.exists() else None
              assert actual == record['before'], f'concurrent source change: {path}'
          patch = payload['patch'].encode()
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          for record in manifest:
              assert blob_sha(pathlib.Path(record['path']).read_bytes()) == record['after'], record['path']
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *sorted(expected_paths)], check=True)
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert staged == expected_paths
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cache-review'
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          PY
          git config user.name 'ChatGPT review assistant'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'server: harden RAM cache retention across slot reuse' -m 'Addresses novkien/llama.cpp-fork#1' -m 'Assisted-by: ChatGPT'
          git rev-parse HEAD | tee "${RUNNER_TEMP}/cache-review/candidate-sha.txt"
      - name: Build the reviewed CPU candidate
        run: |
          set -euo pipefail
          cmake -S . -B build-review -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_APP=OFF -DLLAMA_FATAL_WARNINGS=ON \
            2>&1 | tee "${RUNNER_TEMP}/cache-review/configure.log"
          cmake --build build-review --target llama-server test-server-prompt-cache -j2 \
            2>&1 | tee "${RUNNER_TEMP}/cache-review/build.log"
      - name: Run native and HTTP cache regressions
        run: |
          set -euo pipefail
          python3 -m pip install pytest requests wget 'openai~=2.14.0'
          curl --fail --location --retry 2 --max-time 90 \
            https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf \
            -o "${RUNNER_TEMP}/stories260K.gguf"
          echo "270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d  ${RUNNER_TEMP}/stories260K.gguf" | sha256sum --check
          ctest --test-dir build-review -R '^test-server-prompt-cache$' --output-on-failure \
            2>&1 | tee "${RUNNER_TEMP}/cache-review/ctest.log"
          build-review/bin/test-server-prompt-cache "${RUNNER_TEMP}/stories260K.gguf" \
            2>&1 | tee "${RUNNER_TEMP}/cache-review/native.log"
          cd tools/server/tests
          LLAMA_CACHE_TEST_MODEL="${RUNNER_TEMP}/stories260K.gguf" \
            LLAMA_SERVER_BIN_PATH="${GITHUB_WORKSPACE}/build-review/bin/llama-server" \
            PYTHONPATH=. python3 -m pytest --confcutdir=unit unit/test_completion.py \
            -k cache_retention -q --tb=short \
            2>&1 | tee "${RUNNER_TEMP}/cache-review/http.log"
      - name: Publish without overwriting concurrent work
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/${REVIEW_BRANCH}" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/${REVIEW_BRANCH}"
          git rev-parse HEAD | tee "${RUNNER_TEMP}/cache-review/published-sha.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-review-validation
          path: ${{ runner.temp }}/cache-review/
          retention-days: 3
          if-no-files-found: error
